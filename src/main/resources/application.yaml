spring:
  application:
    name: metriq

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/metriq}
    username: ${DB_USERNAME:stockflow_user}
    password: ${DB_PASSWORD:stockflow_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
